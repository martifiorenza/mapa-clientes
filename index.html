<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.7em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; color: #333; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    h3 { margin-top:0; text-align:center; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
    
    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-download { background: #27ae60; }
    .btn-download:hover { background: #2ecc71; }
    .btn-selection { background: #34495e; border: 1px solid #7f8c8d; }
    .btn-selection.active { background: #9b59b6; border-color: #fff; }
    .btn-clear { background: #e74c3c; font-size: 0.75em; opacity: 0.8; }
    
    .info-count { font-size: 0.8em; color: #ecf0f1; text-align: center; margin: 10px 0; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE MAPA</h3>
  
  <div class="control-group">
    <label>📂 Seleccionar Base:</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Socios CACF (Forrajeros)</option>
      <option value="base2">Socios CAPIA (Avícolas)</option>
      <option value="base3">Socios CAMARCO Santa Fe</option>
      <option value="base4">Comunas y Municipios</option>
      <option value="base5">Cooperativas Agropecuarias</option>
    </select>
    
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>

  <div id="contadorPuntos" class="info-count">Puntos visibles: 0</div>

  <button id="btnModoSeleccion" class="btn-action btn-selection" onclick="toggleModoSeleccion()">
    🖱️ Modo Selección: OFF
  </button>
  <button class="btn-action btn-download" onclick="exportarListado()">📥 Descargar Listado (CSV)</button>
  <button id="btnClear" class="btn-action btn-clear" style="display:none;" onclick="limpiarSeleccionManual()">🧹 Limpiar Selección</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
  var map = L.map('map').setView([-31.63, -60.70], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  let datosBases = { base1: [], base2: [], base3: [], base4: [], base5: [] };
  let geojsonLayer;
  let capaSucursales;
  let seleccionManual = new Set();
  let modoSeleccionActivo = false;

  // Diccionario para nombres descriptivos en la exportación
  const nombresDeBases = {
    'base1': 'Socios CACF (Forrajeros)',
    'base2': 'Socios CAPIA (Avícolas)',
    'base3': 'Socios CAMARCO',
    'base4': 'Comunas y Municipios',
    'base5': 'Cooperativas Agropecuarias'
  };

  function buscarProp(props, clave) {
    if (!props) return null;
    const claveNorm = clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const realKey = Object.keys(props).find(k => k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === claveNorm);
    return realKey ? props[realKey] : null;
  }

  function limpiar(v, reemplazo = "-") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "0") return reemplazo;
    return v.toString().trim();
  }

  function cargarZonasSucursales() {
    fetch('sucursales.geojson').then(r => r.json()).then(data => {
      capaSucursales = L.geoJSON(data, {
        style: { color: "#000", weight: 1.5, fillColor: "#34495e", fillOpacity: 0.05 },
        onEachFeature: (f, l) => {
          const n = buscarProp(f.properties, "name") || buscarProp(f.properties, "sucursal") || "Zona";
          l.bindPopup(`<b>Sucursal:</b><br>${n}`);
        }
      }).addTo(map);
      capaSucursales.bringToBack();
    });
  }

  function procesarFeatures(features, idBase) {
    return (features || []).map((f, index) => {
      let p = f.properties || {};
      p._uniqueID = `${idBase}_${index}`; 
      let rawCRM = buscarProp(p, "crm");
      let idCli = buscarProp(p, "idCliente");
      let estadoFinal = (rawCRM && rawCRM.toString().toUpperCase().trim() === "SI") ? "SI" : "NO";
      if (idBase === 'base4' && (!idCli || idCli === "-" || idCli === "0")) estadoFinal = "NO";
      if (idBase === 'base5') estadoFinal = "NO";
      p.crm_filtrable = estadoFinal;
      return { ...f, properties: p, _baseID: idBase };
    });
  }

  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data3.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data4.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data5.geojson').then(r => r.json()).catch(() => ({features:[]}))
  ]).then(([d1, d2, d3, d4, d5]) => {
    datosBases.base1 = procesarFeatures(d1.features, 'base1');
    datosBases.base2 = procesarFeatures(d2.features, 'base2');
    datosBases.base3 = procesarFeatures(d3.features, 'base3');
    datosBases.base4 = procesarFeatures(d4.features, 'base4');
    datosBases.base5 = procesarFeatures(d5.features, 'base5');
    cargarZonasSucursales();
    actualizarMapa();
  });

  function toggleModoSeleccion() {
    modoSeleccionActivo = !modoSeleccionActivo;
    const btn = document.getElementById("btnModoSeleccion");
    btn.innerText = modoSeleccionActivo ? "🖱️ Modo Selección: ON" : "🖱️ Modo Selección: OFF";
    btn.classList.toggle("active", modoSeleccionActivo);
    document.getElementById("btnClear").style.display = seleccionManual.size > 0 ? "block" : "none";
  }

  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    const baseFiltro = document.getElementById("filtroBase").value;
    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = [];
    if (baseFiltro === "todas") {
      combinados = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3, ...datosBases.base4, ...datosBases.base5];
    } else {
      combinados = datosBases[baseFiltro] || [];
    }

    geojsonLayer = L.geoJSON(combinados, {
      filter: (f) => (crmFiltro === "todos" || f.properties.crm_filtrable === crmFiltro),
      pointToLayer: (f, latlng) => {
        let col = "#3498db"; 
        if (f._baseID === 'base5') col = "#27ae60";
        if (f._baseID === 'base4') col = "#9b59b6";
        if (f._baseID === 'base3') col = "#f1c40f"; 
        if (f._baseID === 'base2') col = "#e67e22"; 
        
        let isSelected = seleccionManual.has(f.properties._uniqueID);
        return L.circleMarker(latlng, { 
          radius: isSelected ? 10 : 8, 
          fillColor: col, 
          color: isSelected ? "#000" : "#fff", 
          weight: isSelected ? 4 : 1.5, 
          fillOpacity: 0.9 
        });
      },
      onEachFeature: (f, layer) => {
        const p = f.properties;
        const idBase = f._baseID;
        const crmEstado = p.crm_filtrable;
        const nombre = limpiar(buscarProp(p, "cliente") || buscarProp(p, "nombre"));
        
        layer.on('click', (e) => {
          if (modoSeleccionActivo) {
            L.DomEvent.stopPropagation(e);
            const uid = p._uniqueID;
            if (seleccionManual.has(uid)) seleccionManual.delete(uid);
            else seleccionManual.add(uid);
            actualizarMapa();
            document.getElementById("btnClear").style.display = seleccionManual.size > 0 ? "block" : "none";
          }
        });

        let colH = (idBase === 'base4') ? "#8e44ad" : (idBase === 'base3' ? "#f39c12" : (idBase === 'base2' ? "#d35400" : "#2980b9"));
        let html = `<div style="min-width: 200px;"><b style="color:${colH}; text-transform:uppercase;">${nombre}</b><hr style="margin:5px 0; border:0; border-top:1px solid #eee;">`;
        
        if (idBase === 'base2') {
          html += `📍 <b>Ubicación:</b> ${limpiar(buscarProp(p, "localidad"))}, ${limpiar(buscarProp(p, "provincia"))}<br>🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>🔍 <b>Relevado:</b> ${limpiar(buscarProp(p, "relevado"))}`;
        } else if (idBase === 'base1') {
          html += `📍 <b>Dir:</b> ${limpiar(buscarProp(p, "direccion"))}<br>📞 <b>Tel:</b> ${limpiar(buscarProp(p, "telefono"))}<br>📧 <b>Mail:</b> ${limpiar(buscarProp(p, "correo"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base3') {
          html += `🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>📍 <b>Dir:</b> ${limpiar(buscarProp(p, "direccion"))}, ${limpiar(buscarProp(p, "localidad"))}<br>🏢 <b>Suc:</b> ${limpiar(buscarProp(p, "sucursal"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base4') {
          html += `🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>🆔 <b>ID:</b> ${limpiar(buscarProp(p, "idCliente"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base5') {
          html += `🏢 <b>Tipo:</b> ${limpiar(buscarProp(p, "tipo de espacio"))}<br>📍 <b>Dir:</b> ${limpiar(buscarProp(p, "direccion"))}, ${limpiar(buscarProp(p, "provincia"))}`;
        }
        html += `<div style="margin-top:8px; border-top:1px solid #eee; padding-top:5px; font-weight:bold; color:${crmEstado==='SI'?'#27ae60':'#e74c3c'}">CRM: ${crmEstado}</div></div>`;
        layer.bindPopup(html);
      }
    }).addTo(map);

    document.getElementById("contadorPuntos").innerText = `Visibles: ${Object.keys(geojsonLayer._layers).length} | Seleccionados: ${seleccionManual.size}`;
  }

  function exportarListado() {
    let seleccionados = [];
    if (seleccionManual.size > 0) {
      const todos = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3, ...datosBases.base4, ...datosBases.base5];
      seleccionados = todos.filter(f => seleccionManual.has(f.properties._uniqueID));
    } else {
      geojsonLayer.eachLayer(l => seleccionados.push(l.feature));
    }

    if (seleccionados.length === 0) { alert("No hay datos para exportar."); return; }

    let csv = "\uFEFFBase,Nombre,CRM,Zona_Sucursal,CUIT,ID_Cliente,Direccion,Localidad,Provincia,Telefono,Email,Maquinas,Relevado,Tipo_Espacio\n";
    
    seleccionados.forEach(f => {
      const p = f.properties;
      let zona = "Fuera de ADR";
      if (capaSucursales) {
        const pt = turf.point(f.geometry.coordinates);
        capaSucursales.eachLayer(z => { if(turf.booleanPointInPolygon(pt, z.feature)) zona = buscarProp(z.feature.properties, "name") || "ADR"; });
      }

      const row = [
        nombresDeBases[f._baseID] || f._baseID, // Aquí ahora usa el nombre real
        limpiar(buscarProp(p, "cliente") || buscarProp(p, "nombre")).replace(/,/g, ""),
        p.crm_filtrable,
        zona,
        limpiar(buscarProp(p, "cuit")),
        limpiar(buscarProp(p, "idCliente")),
        limpiar(buscarProp(p, "direccion") || buscarProp(p, "geocoding")).replace(/,/g, " "),
        limpiar(buscarProp(p, "localidad")),
        limpiar(buscarProp(p, "provincia")),
        limpiar(buscarProp(p, "telefono")),
        limpiar(buscarProp(p, "correo") || buscarProp(p, "email")),
        limpiar(buscarProp(p, "maquinas")).replace(/,/g, " "),
        limpiar(buscarProp(p, "relevado")),
        limpiar(buscarProp(p, "tipo de espacio"))
      ];
      csv += row.join(",") + "\n";
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `reporte_comercial_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  function limpiarSeleccionManual() { seleccionManual.clear(); actualizarMapa(); document.getElementById("btnClear").style.display = "none"; }

  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
  document.getElementById("filtroBase").addEventListener("change", actualizarMapa);
</script>
</body>
</html>
