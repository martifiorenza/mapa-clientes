<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Agrícola Interactivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #panelCapas h3 { margin: 0 0 15px 0; font-size: 1.1em; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
    .control-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 0.75em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #fdfdfd; color: #333; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE CLIENTES</h3>
  <div class="control-group">
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  var map = L.map('map').setView([-32.0, -61.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  let datosGlobal = { features: [] };
  let geojsonLayer;

  function buscarProp(props, clave) {
    if (!props) return null;
    const realKey = Object.keys(props).find(k => k.toLowerCase() === clave.toLowerCase());
    return realKey ? props[realKey] : null;
  }

  function limpiar(v, reemplazo = "N/A") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "-" || v === "NaN") return reemplazo;
    return v.toString().trim();
  }

  // Carga el archivo que me pasaste
  fetch('clientes_geo.json') 
    .then(r => r.json())
    .then(data => {
      datosGlobal = data;
      actualizarMapa();
    })
    .catch(err => console.error("Error cargando el archivo JSON:", err));

  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    if (geojsonLayer) map.removeLayer(geojsonLayer);

    geojsonLayer = L.geoJSON(datosGlobal, {
      filter: function(f) {
        if (crmFiltro === "todos") return true;
        let valorCRM = buscarProp(f.properties, "crm");
        return limpiar(valorCRM).toUpperCase() === crmFiltro;
      },
      onEachFeature: function(f, layer) {
        const p = f.properties;
        const nombre = limpiar(buscarProp(p, "cliente"), "Empresa");
        const ubicacion = limpiar(buscarProp(p, "geocoding"), "Ubicación no disponible");
        const crm = limpiar(buscarProp(p, "crm"), "NO").toUpperCase();

        let html = `<div style="min-width: 200px; font-family: Arial, sans-serif;">
          <b style="color: #d35400; text-transform: uppercase;">${nombre}</b>
          <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
          📍 <b>Ubicación:</b><br>
          <small style="color: #555;">${ubicacion}</small><br>
          <div style="background:#f8f9fa; padding:10px; border-radius:8px; margin-top:12px; border-left:5px solid #2c3e4e; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; font-size: 11px; color: #7f8c8d;">ESTADO CRM</span>
            <span style="color: ${crm === 'SI' ? '#27ae60' : '#e74c3c'}; font-weight: 800;">${crm}</span>
          </div>
        </div>`;
        layer.bindPopup(html);
      }
    }).addTo(map);
  }

  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
</script>
</body>
</html>
