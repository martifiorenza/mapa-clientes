<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Agrícola Interactivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }

    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #panelCapas h3 {
      margin: 0 0 15px 0;
      font-size: 1.1em;
      text-align: center;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    .control-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.75em;
      font-weight: bold;
      color: #bdc3c7;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE CLIENTES</h3>

  <div class="control-group">
    <label>Base</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">CACF</option>
      <option value="base2">CAPIA</option>
      <option value="base3">CAMARCO</option>
    </select>
  </div>

  <div class="control-group">
    <label>CRM</label>
    <select id="filtroCRM">
      <option value="todos">Todos</option>
      <option value="SI">SI</option>
      <option value="NO">NO</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

var map = L.map('map').setView([-31.63, -60.70], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let datosBases = { base1: [], base2: [], base3: [] };
let geojsonLayer;
let capaSucursales;

// NORMALIZADOR
function normalizar(txt) {
  return (txt || "")
    .toString()
    .toUpperCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

// BUSCADOR FLEXIBLE
function buscarProp(props, clave) {
  if (!props) return null;
  const claveNorm = normalizar(clave);
  const realKey = Object.keys(props).find(k => normalizar(k) === claveNorm);
  return realKey ? props[realKey] : null;
}

// LIMPIADOR
function limpiar(v, reemplazo = "-") {
  return (!v || v.toString().trim() === "") ? reemplazo : v.toString().trim();
}

// VALIDADOR DE FEATURES (CLAVE)
function esFeatureValido(f) {
  return (
    f &&
    f.type === "Feature" &&
    f.geometry &&
    f.geometry.type === "Point" &&
    Array.isArray(f.geometry.coordinates)
  );
}

// CARGA
Promise.all([
  fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
  fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]})),
  fetch('data3.geojson').then(r => r.json()).catch(() => ({features:[]}))
]).then(([d1, d2, d3]) => {

  datosBases.base1 = (d1.features || []).filter(esFeatureValido).map(f => ({...f, _baseID: 'base1'}));
  datosBases.base2 = (d2.features || []).filter(esFeatureValido).map(f => ({...f, _baseID: 'base2'}));
  datosBases.base3 = (d3.features || []).filter(esFeatureValido).map(f => ({...f, _baseID: 'base3'}));

  console.log("Base1:", datosBases.base1.length);
  console.log("Base2:", datosBases.base2.length);
  console.log("Base3:", datosBases.base3.length);

  actualizarMapa();
});

// ACTUALIZAR MAPA
function actualizarMapa() {

  const crmFiltro = document.getElementById("filtroCRM").value;
  const baseFiltro = document.getElementById("filtroBase").value;

  if (geojsonLayer) map.removeLayer(geojsonLayer);

  let combinados = [];

  if (baseFiltro === "todas") {
    combinados = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3];
  } else {
    combinados = datosBases[baseFiltro] || [];
  }

  geojsonLayer = L.geoJSON(combinados, {

    filter: function(f) {
      if (crmFiltro === "todos") return true;

      const crmVal = normalizar(buscarProp(f.properties, "crm") || "NO");
      return crmVal === crmFiltro;
    },

    pointToLayer: function(f, latlng) {
      let col = "#3498db";
      if (f._baseID === 'base2') col = "#e67e22";
      if (f._baseID === 'base3') col = "#f1c40f";

      return L.circleMarker(latlng, {
        radius: 7,
        fillColor: col,
        color: "#fff",
        weight: 1,
        fillOpacity: 0.9
      });
    },

    onEachFeature: function(f, layer) {

      const p = f.properties;

      const nombre = limpiar(buscarProp(p, "nombre") || buscarProp(p, "cliente"));
      const crm = normalizar(buscarProp(p, "crm") || "NO");

      let html = `
        <b>${nombre}</b><br>
        📍 ${limpiar(buscarProp(p, "localidad"))}<br>
        🆔 ${limpiar(buscarProp(p, "cuit"))}<br>
        🚜 ${limpiar(buscarProp(p, "maquinas"))}<br>
        <b style="color:${crm === "SI" ? "green" : "red"}">CRM: ${crm}</b>
      `;

      layer.bindPopup(html);
    }

  }).addTo(map);

  // AUTO ZOOM
  if (geojsonLayer.getLayers().length > 0) {
    map.fitBounds(geojsonLayer.getBounds(), { padding: [20,20] });
  }
}

// EVENTOS
document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
document.getElementById("filtroBase").addEventListener("change", actualizarMapa);

</script>
</body>
</html>
