<h2>Mapa de Clientes</h2>

<select id="filtroCRM">
  <option value="todos">Todos</option>
  <option value="SI">CRM SI</option>
  <option value="NO">CRM NO</option>
</select>

<div id="map" style="height: 600px;"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([-31.65, -60.71], 6);

// Mapa base (gratis)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Traer datos
let geojsonLayer;
let datosGlobal;

fetch('data.geojson')
  .then(res => res.json())
  .then(data => {
    datosGlobal = data;
    renderMapa("todos");
  });

function renderMapa(filtro) {

  if (geojsonLayer) {
    map.removeLayer(geojsonLayer);
  }

  geojsonLayer = L.geoJSON(datosGlobal, {
    filter: function (feature) {
      if (filtro === "todos") return true;
      return feature.properties.crm === filtro;
    },
    onEachFeature: function (feature, layer) {
      layer.bindPopup(`
        <b>${feature.properties.empresa}</b><br>
        📊 CRM: ${feature.properties.crm}<br>
        🔢 Cantidad: ${feature.properties.cantidad}
      `);
    }
  }).addTo(map);
}

document.getElementById("filtroCRM").addEventListener("change", function(e) {
  renderMapa(e.target.value);
});
