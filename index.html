<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de Leads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.Default.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a5276, #2c3e50); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    #loginBox { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; max-width: 360px; width: 90%; }
    #loginBox h2 { color: #2c3e50; margin-bottom: 20px; }
    .brand-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
    .brand-logo { position: relative; width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, #27ae60, #2c3e50); box-shadow: 0 10px 24px rgba(44, 62, 80, 0.25); flex: 0 0 auto; }
    .brand-logo::before { content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 13px; height: 13px; border-radius: 50%; background: #fff; }
    .brand-logo::after { content: ""; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 24px; height: 17px; border-radius: 16px 16px 10px 10px; background: #fff; }
    .brand-name { margin: 0; color: #2c3e50; font-size: 1.35em; line-height: 1; font-weight: 800; }
    .brand-subtitle { margin: 4px 0 0; color: #7f8c8d; font-size: 0.9em; }
    .web-link-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; word-break: break-word; }
    .web-link-row a { color: #2980b9; text-decoration: none; }
    .web-link-row a:hover { text-decoration: underline; }
    .web-link-icon { position: relative; width: 18px; height: 18px; border-radius: 6px; flex: 0 0 auto; background: linear-gradient(135deg, #27ae60, #2c3e50); box-shadow: 0 4px 12px rgba(44, 62, 80, 0.18); }
    .web-link-icon::before { content: ""; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #fff; }
    .web-link-icon::after { content: ""; position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); width: 9px; height: 7px; border-radius: 8px 8px 5px 5px; background: #fff; }
    #loginBox input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 18px; text-align: center; letter-spacing: 4px; }
    #loginBox button { width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    #loginBox button:hover { background: #34495e; }
    #loginError { color: #e74c3c; margin-top: 10px; font-size: 14px; display: none; }
    #map { height: 100vh; width: 100%; display: none; }
    #panelCapas { position: absolute; top: 20px; right: 20px; z-index: 1000; background: #2c3e50; color: white; padding: 20px; border-radius: 12px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .control-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 0.7em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; color: #333; font-weight: 600; cursor: pointer; }
    h3 { margin-top: 0; text-align: center; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
    #panelCapas h3 { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .switch-group { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .switch-group label { margin: 0; cursor: pointer; color: #fff; font-size: 0.85em; text-transform: none; }
    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-download { background: #27ae60; }
    .btn-download:hover { background: #2ecc71; }
    .btn-selection { background: #34495e; border: 1px solid #7f8c8d; }
    .btn-selection.active { background: #9b59b6; border-color: #fff; }
    .btn-clear { background: #e74c3c; font-size: 0.8em; }
    .info-count { font-size: 0.8em; color: #ecf0f1; text-align: center; margin: 10px 0; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; }
    #btnMetricasToggle { position: fixed; top: 100px; left: 20px; z-index: 1001; width: 42px; height: 42px; border: none; border-radius: 50%; background: #2c3e50; color: #fff; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.35); font-size: 18px; display: flex; align-items: center; justify-content: center; }
    #btnMetricasToggle:hover { background: #34495e; }
    #metricasPanel { position: fixed; top: 152px; left: 20px; z-index: 1000; width: 230px; max-width: calc(100vw - 40px); max-height: calc(100vh - 172px); overflow: auto; background: #2c3e50; color: white; padding: 14px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12); opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(-10px); transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease; }
    #metricasPanel.abierto { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0); }
    #metricasPanel .metricas-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    #metricasPanel .metricas-titulo { font-size: 0.72em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; margin: 0; }
    #metricasPanel .metricas-cerrar { border: none; background: rgba(255,255,255,0.1); color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    #metricasPanel .metricas-linea { display: flex; justify-content: space-between; gap: 10px; font-size: 0.82em; color: #ecf0f1; margin-bottom: 6px; }
    #metricasPanel .metricas-lista { margin: 8px 0 0; padding: 0; list-style: none; max-height: 150px; overflow: auto; }
    #metricasPanel .metricas-lista li { display: flex; justify-content: space-between; gap: 10px; font-size: 0.76em; color: #ecf0f1; padding: 3px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    #metricasPanel .metricas-rango { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); }
    #metricasPanel .metricas-rango label { display: block; margin-bottom: 6px; font-size: 0.68em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    #metricasPanel .metricas-rango-fila { display: flex; gap: 8px; }
    #metricasPanel .metricas-rango-fila input { width: 100%; padding: 8px; border-radius: 8px; border: none; font-size: 12px; }
    #metricasPanel .metricas-rango button { width: 100%; }
    #contenedorDelegacion, #contenedorMisionesBase { display: none; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px dashed #7f8c8d; margin-top: 10px; }
    .marker-cluster-small { background-color: rgba(52, 152, 219, 0.6); }
    .marker-cluster-small div { background-color: rgba(52, 152, 219, 0.8); }
    .marker-cluster-medium { background-color: rgba(241, 196, 15, 0.6); }
    .marker-cluster-medium div { background-color: rgba(241, 196, 15, 0.8); }
    .marker-cluster-large { background-color: rgba(155, 89, 182, 0.6); }
    .marker-cluster-large div { background-color: rgba(155, 89, 182, 0.8); }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { color: white; font-weight: bold; }
    .marker-cluster div { width: 30px; height: 30px; margin-left: 5px; margin-top: 5px; text-align: center; border-radius: 50%; font-size: 12px; line-height: 30px; }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <div id="loginBox">
      <div class="brand-row">
        <div class="brand-logo"></div>
        <div>
          <p class="brand-name">Mapa de Leads</p>
          <p class="brand-subtitle">Ingrese Codigo</p>
        </div>
      </div>
      <input type="password" id="inputCodigo" placeholder="******" maxlength="6">
      <button id="btnIngresar">INGRESAR</button>
      <div id="loginError">Codigo incorrecto</div>
    </div>
  </div>

  <div id="panelCapas">
    <h3><span>Mapa de Leads</span></h3>
    <div class="switch-group">
      <label for="checkADR">Ver Capa ADR (Sucursales)</label>
      <input type="checkbox" id="checkADR" checked onchange="toggleCapaADR()">
    </div>
    <div class="control-group">
      <label>Seleccionar Base:</label>
      <select id="filtroBase" onchange="gestionarFiltrosEspeciales()">
        <option value="todas">Todas las Bases</option>
        <option value="base1">Socios CACF (Forrajeros)</option>
        <option value="base2">Socios CAPIA (Avicolas)</option>
        <option value="base3">Socios CAMARCO</option>
        <option value="base4">Comunas y Municipios</option>
        <option value="base5">Cooperativas Agropecuarias</option>
        <option value="base6">Bases Misiones</option>
        <option value="base7">Bases Misiones 2</option>
        <option value="base9">Prooveedores Santa Fe</option>
        <option value="base10">Listados Corrientes</option>
      </select>
    </div>
    <div id="contenedorDelegacion" class="control-group">
      <label>Filtrar por Delegacion:</label>
      <select id="filtroDelegacion" onchange="actualizarMapa()">
        <option value="todas">Todas las Delegaciones</option>
      </select>
    </div>
    <div id="contenedorMisionesBase" class="control-group">
      <label>Filtrar por Sub-Base (Misiones):</label>
      <select id="filtroMisionesSubBase" onchange="actualizarMapa()">
        <option value="todas">Todas las Sub-Bases</option>
      </select>
    </div>
    <div id="contenedorRubro" class="control-group" style="display:none;">
      <label>Filtrar por Rubro:</label>
      <select id="filtroRubro" onchange="actualizarMapa()">
        <option value="todos">Todos los Rubros</option>
      </select>
    </div>
    <div class="control-group">
      <label>Estado CRM:</label>
      <select id="filtroCRM" onchange="actualizarMapa()">
        <option value="todos">Todos los Clientes</option>
        <option value="SI">En CRM (SI)</option>
        <option value="NO">Fuera de CRM (NO)</option>
      </select>
    </div>
    <div id="contadorPuntos" class="info-count">Visibles: 0 | Seleccionados: 0</div>
    <button id="btnMetricasToggle" type="button" onclick="toggleMetricasPanel()" aria-controls="metricasPanel" aria-expanded="false">&#128202;</button>
    <div id="metricasPanel" aria-hidden="true">
      <div class="metricas-header">
        <div class="metricas-titulo">Metricas globales</div>
        <button type="button" class="metricas-cerrar" onclick="toggleMetricasPanel()" aria-label="Cerrar metricas">&times;</button>
      </div>
      <div class="metricas-linea"><span>Ingresos de hoy</span><strong id="metricasIngresosHoy">0</strong></div>
      <div class="metricas-linea"><span>Exportaciones de hoy</span><strong id="metricasExportacionesHoy">0</strong></div>
      <ul id="metricasHistorial" class="metricas-lista"></ul>
      <div class="metricas-rango">
        <label>Exportar rango</label>
        <div class="metricas-rango-fila">
          <input type="date" id="metricasDesde" aria-label="Fecha desde">
          <input type="date" id="metricasHasta" aria-label="Fecha hasta">
        </div>
        <button type="button" class="btn-action btn-download" onclick="exportarMetricasRango()">Descargar métricas (CSV)</button>
      </div>
    </div>
    <button id="btnModoSeleccion" class="btn-action btn-selection" onclick="toggleModoSeleccion()">Modo Seleccion: OFF</button>
    <button class="btn-action btn-download" onclick="exportarListado()">Descargar Listado (CSV)</button>
    <button id="btnClear" class="btn-action btn-clear" style="display:none;" onclick="limpiarSeleccionManual()">Limpiar Seleccion</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    var CODIGO_SECRETO = "159753";
    var METRICAS_STORAGE_KEY = "mapa-clientes-metricas-v1";
    var METRICAS_API_URL = "/api/metrics";
    var metricasGlobalesActuales = null;
    var map, datosBases, geojsonLayer, clusterGroup, capaSucursales, seleccionManual, modoSeleccionActivo;
    var zonaSeleccionadaLayer = null;
    var nombresDeBases = {
      'base1': 'Socios CACF (Forrajeros)',
      'base2': 'Socios CAPIA (Avicolas)',
      'base3': 'Socios CAMARCO',
      'base4': 'Comunas y Municipios',
      'base5': 'Cooperativas Agropecuarias',
      'base6': 'Bases Misiones',
      'base7': 'Bases Misiones 2',
      'base9': 'Prooveedores Santa Fe',
      'base10': 'Listados Corrientes'
    };

    document.getElementById("btnIngresar").addEventListener("click", verificarCodigo);
    document.getElementById("inputCodigo").addEventListener("keypress", function(e) {
      if (e.key === "Enter") verificarCodigo();
    });

    function obtenerFechaLocalKey(fecha) {
      var d = fecha || new Date();
      var anio = d.getFullYear();
      var mes = String(d.getMonth() + 1).padStart(2, "0");
      var dia = String(d.getDate()).padStart(2, "0");
      return anio + "-" + mes + "-" + dia;
    }

    function formatearFechaCorta(fechaKey) {
      var partes = fechaKey.split("-");
      if (partes.length !== 3) return fechaKey;
      return partes[2] + "/" + partes[1] + "/" + partes[0].slice(2);
    }

    function obtenerMetricasActuales() {
      return metricasGlobalesActuales || obtenerMetricasFallback();
    }

    function listarFechasMetricas(metricas) {
      return Object.keys((metricas && metricas.dias) || {}).sort();
    }

    function prepararSelectorRangoMetricas(metricas) {
      var desde = document.getElementById("metricasDesde");
      var hasta = document.getElementById("metricasHasta");
      if (!desde || !hasta) return;

      var fechas = listarFechasMetricas(metricas);
      if (fechas.length === 0) {
        desde.value = "";
        hasta.value = "";
        desde.removeAttribute("min");
        desde.removeAttribute("max");
        hasta.removeAttribute("min");
        hasta.removeAttribute("max");
        return;
      }

      var minimo = fechas[0];
      var maximo = fechas[fechas.length - 1];
      desde.min = minimo;
      desde.max = maximo;
      hasta.min = minimo;
      hasta.max = maximo;

      if (!desde.value || desde.value < minimo || desde.value > maximo) desde.value = minimo;
      if (!hasta.value || hasta.value < minimo || hasta.value > maximo) hasta.value = maximo;
      if (desde.value > hasta.value) {
        desde.value = minimo;
        hasta.value = maximo;
      }
    }

    function csvEscapar(v) {
      var texto = (v === null || v === undefined) ? "" : v.toString();
      if (texto.indexOf('"') !== -1) texto = texto.replace(/"/g, '""');
      if (/[",\n;]/.test(texto)) return '"' + texto + '"';
      return texto;
    }

    function exportarMetricasRango() {
      var metricas = obtenerMetricasActuales();
      var fechas = listarFechasMetricas(metricas);
      if (fechas.length === 0) {
        alert("No hay metricas para exportar");
        return;
      }

      var desde = document.getElementById("metricasDesde").value || fechas[0];
      var hasta = document.getElementById("metricasHasta").value || fechas[fechas.length - 1];

      if (desde > hasta) {
        alert("La fecha desde no puede ser mayor que la fecha hasta");
        return;
      }

      var lineas = ["Fecha,Ingresos,Exportaciones"];
      fechas.forEach(function(fechaKey) {
        if (fechaKey >= desde && fechaKey <= hasta) {
          var dia = metricas.dias[fechaKey] || { ingresos: 0, exportaciones: 0 };
          lineas.push([csvEscapar(fechaKey), csvEscapar(dia.ingresos), csvEscapar(dia.exportaciones)].join(","));
        }
      });

      if (lineas.length === 1) {
        alert("No hay metricas en ese rango");
        return;
      }

      var blob = new Blob([lineas.join("\n")], { type: "text/csv;charset=utf-8;" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "metricas_" + desde + "_a_" + hasta + ".csv";
      link.click();
      setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
    }

    function toggleMetricasPanel() {
      var panel = document.getElementById("metricasPanel");
      var boton = document.getElementById("btnMetricasToggle");
      var abierto = panel.classList.toggle("abierto");
      panel.setAttribute("aria-hidden", abierto ? "false" : "true");
      boton.setAttribute("aria-expanded", abierto ? "true" : "false");
    }

    function actualizarMetricasUI(metricas) {
      var datos = metricas || obtenerMetricasFallback();
      metricasGlobalesActuales = datos;
      prepararSelectorRangoMetricas(datos);
      var hoy = obtenerFechaLocalKey();
      var hoyData = datos.dias[hoy] || { ingresos: 0, exportaciones: 0 };
      document.getElementById("metricasIngresosHoy").innerText = hoyData.ingresos;
      document.getElementById("metricasExportacionesHoy").innerText = hoyData.exportaciones;

      var historial = document.getElementById("metricasHistorial");
      if (!historial) return;
      var fechas = Object.keys(datos.dias).sort(function(a, b) { return b.localeCompare(a); }).slice(0, 7);
      historial.innerHTML = "";
      if (fechas.length === 0) {
        historial.innerHTML = '<li><span>Sin datos</span><span>-</span></li>';
        return;
      }
      fechas.forEach(function(fechaKey) {
        var dia = datos.dias[fechaKey];
        var li = document.createElement("li");
        li.innerHTML = '<span>' + formatearFechaCorta(fechaKey) + '</span><span>I:' + dia.ingresos + ' | E:' + dia.exportaciones + '</span>';
        historial.appendChild(li);
      });
    }

    cargarMetricasGlobales().then(actualizarMetricasUI).catch(function() {
      actualizarMetricasUI(obtenerMetricasFallback());
    });

    function verificarCodigo() {
      var input = document.getElementById("inputCodigo").value;
      var error = document.getElementById("loginError");
      if (input === CODIGO_SECRETO) {
        registrarEventoMetrica("ingreso");
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("map").style.display = "block";
        initMapa();
      } else {
        error.style.display = "block";
        document.getElementById("inputCodigo").value = "";
      }
    }

    function initMapa() {
      map = L.map('map').setView([-31.63, -60.70], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(map);
      datosBases = { base1: [], base2: [], base3: [], base4: [], base5: [], base6: [], base7: [], base9: [], base10: [] };
      geojsonLayer = null;
      clusterGroup = null;
      capaSucursales = null;
      seleccionManual = new Set();
      modoSeleccionActivo = false;
      zonaSeleccionadaLayer = null;

      Promise.all([
        fetch('data.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data2.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data3.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data4.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data5.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data6.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data7.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data8.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data9.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data10.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; }),
        fetch('data11.geojson').then(function(r) { return r.json(); }).catch(function() { return {features: []}; })
      ]).then(function(results) {
        var d1 = results[0], d2 = results[1], d3 = results[2], d4 = results[3], d5 = results[4], d6 = results[5], d7 = results[6], d8 = results[7], d9 = results[8], d10 = results[9], d11 = results[10];
        datosBases.base1 = procesarFeatures(d1.features, 'base1');
        datosBases.base2 = procesarFeatures(d2.features, 'base2');
        datosBases.base3 = procesarFeatures((d3.features || []).concat(d11.features || []), 'base3');
        datosBases.base4 = procesarFeatures(d4.features, 'base4');
        datosBases.base5 = procesarFeatures(d5.features, 'base5');
        var misionesFeatures = (d6.features || []).concat(d7.features || []);
        datosBases.base6 = procesarFeatures(misionesFeatures, 'base6');
        datosBases.base7 = procesarFeatures(d8.features || [], 'base7');
        datosBases.base9 = procesarFeatures(d9.features || [], 'base9');
        datosBases.base10 = procesarFeatures(d10.features || [], 'base10');
        llenarSelectorDelegaciones();
        llenarSelectorMisionesBase();
        cargarZonasSucursales();
        actualizarMapa();
      });
    }

    function buscarProp(props, clave) {
      if (!props) return null;
      var claveNorm = clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      var realKey = Object.keys(props).find(function(k) {
        return k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === claveNorm;
      });
      return realKey ? props[realKey] : null;
    }

    function limpiar(v, reemplazo) {
      reemplazo = reemplazo || "-";
      if (v === undefined || v === null || v.toString().trim() === "" || v === "0") return reemplazo;
      return v.toString().trim();
    }

    function normalizarTexto(v) {
      return limpiar(v, "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function procesarFeatures(features, idBase) {
      return (features || []).map(function(f, index) {
        var p = f.properties || {};
        p._uniqueID = idBase + "_" + index;
        var rawCRM = buscarProp(p, "crm");
        var estadoFinal = "NO";
        if (rawCRM && rawCRM.toString().toUpperCase().trim().indexOf("SI") !== -1) {
          estadoFinal = "SI";
        }
        p.crm_filtrable = estadoFinal;
        return { type: "Feature", geometry: f.geometry, properties: p, _baseID: idBase };
      });
    }

    function obtenerMetricasFallback() {
      try {
        var raw = localStorage.getItem(METRICAS_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { dias: {} };
    }

    function guardarMetricasFallback(metricas) {
      try {
        localStorage.setItem(METRICAS_STORAGE_KEY, JSON.stringify(metricas));
      } catch (e) {}
    }

    function cargarMetricasGlobales() {
      return fetch(METRICAS_API_URL, { cache: "no-store" }).then(function(r) {
        if (!r.ok) throw new Error("No se pudieron cargar las metricas");
        return r.json();
      });
    }

    function registrarEventoMetrica(tipo) {
      var payload = { tipo: tipo, fecha: obtenerFechaLocalKey() };
      return fetch(METRICAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function(r) {
        if (!r.ok) throw new Error("No se pudieron guardar las metricas");
        return r.json();
      }).then(function(data) {
        actualizarMetricasUI(data);
        return data;
      }).catch(function() {
        var metricas = obtenerMetricasFallback();
        var hoy = obtenerFechaLocalKey();
        if (!metricas.dias[hoy]) {
          metricas.dias[hoy] = { ingresos: 0, exportaciones: 0 };
        }
        if (tipo === "ingreso") metricas.dias[hoy].ingresos += 1;
        if (tipo === "exportacion") metricas.dias[hoy].exportaciones += 1;
        guardarMetricasFallback(metricas);
        actualizarMetricasUI(metricas);
        return metricas;
      });
    }

    function toggleCapaADR() {
      if (!capaSucursales) return;
      if (document.getElementById("checkADR").checked) {
        capaSucursales.addTo(map);
        capaSucursales.bringToBack();
      } else {
        map.removeLayer(capaSucursales);
      }
    }

    function cargarZonasSucursales() {
      fetch('sucursales.geojson').then(function(r) { return r.json(); }).then(function(data) {
        capaSucursales = L.geoJSON(data, {
          style: { color: "#2c3e50", weight: 2, fillColor: "#34495e", fillOpacity: 0.1 },
          onEachFeature: function(f, layer) {
            var nombreZona = limpiar(buscarProp(f.properties, "name") || buscarProp(f.properties, "nombre"));
            layer.bindPopup('<b>' + nombreZona + '</b>');
            layer.on('click', function(e) {
              L.DomEvent.stopPropagation(e);
              layer.openPopup();
              if (modoSeleccionActivo) seleccionarZonaADR(layer, nombreZona);
            });
          }
        });
        toggleCapaADR();
      }).catch(function(e) { console.log("Sucursales no encontradas"); });
    }

    function llenarSelectorDelegaciones() {
      var selector = document.getElementById("filtroDelegacion");
      selector.innerHTML = '<option value="todas">Todas las Delegaciones</option>';
      var delegaciones = datosBases.base3.map(function(f) { return buscarProp(f.properties, "delegacion"); }).filter(function(d) { return d; });
      var unicas = [...new Set(delegaciones)].sort();
      unicas.forEach(function(d) {
        var opt = document.createElement("option");
        opt.value = d;
        opt.innerText = d;
        selector.appendChild(opt);
      });
    }

    function llenarSelectorMisionesBase() {
      var selector = document.getElementById("filtroMisionesSubBase");
      selector.innerHTML = '<option value="todas">Todas las Sub-Bases</option>';
      var basesMisiones = datosBases.base6.map(function(f) { return buscarProp(f.properties, "base"); }).filter(function(b) { return b; });
      var unicas = [...new Set(basesMisiones)].sort();
      unicas.forEach(function(b) {
        var opt = document.createElement("option");
        opt.value = b;
        opt.innerText = b;
        selector.appendChild(opt);
      });
    }

    function llenarSelectorRubros(base) {
      var selector = document.getElementById("filtroRubro");
      selector.innerHTML = '<option value="todos">Todos los Rubros</option>';

      var fuente = datosBases[base] || [];
      var rubros = fuente.map(function(f) {
        return buscarProp(f.properties, "rubro");
      }).filter(function(r) { return r; });

      var unicas = [...new Set(rubros)].sort();
      unicas.forEach(function(r) {
        var opt = document.createElement("option");
        opt.value = r;
        opt.innerText = r;
        selector.appendChild(opt);
      });
    }

    function gestionarFiltrosEspeciales() {
      var base = document.getElementById("filtroBase").value;
      document.getElementById("contenedorDelegacion").style.display = (base === "base3" || base === "todas") ? "block" : "none";
      document.getElementById("contenedorMisionesBase").style.display = (base === "base6" || base === "todas") ? "block" : "none";
      var mostrarRubro = (base === "base7" || base === "base9" || base === "base10");
      document.getElementById("contenedorRubro").style.display = mostrarRubro ? "block" : "none";
      if (mostrarRubro) llenarSelectorRubros(base);
      else document.getElementById("filtroRubro").value = "todos";
      actualizarMapa();
    }

    function toggleModoSeleccion() {
      modoSeleccionActivo = !modoSeleccionActivo;
      document.getElementById("btnModoSeleccion").classList.toggle("active", modoSeleccionActivo);
      document.getElementById("btnModoSeleccion").innerText = modoSeleccionActivo ? "Modo Seleccion: ON" : "Modo Seleccion: OFF";
      if (clusterGroup) clusterGroup.options.zoomToBoundsOnClick = !modoSeleccionActivo;
    }

    function limpiarSeleccionManual() {
      seleccionManual.clear();
      limpiarSeleccionADR();
      actualizarMapa();
      actualizarBotonLimpiar();
    }

    function actualizarBotonLimpiar() {
      document.getElementById("btnClear").style.display = (seleccionManual.size > 0 || zonaSeleccionadaLayer) ? "block" : "none";
    }

    function limpiarSeleccionADR() {
      if (!zonaSeleccionadaLayer || !capaSucursales) {
        zonaSeleccionadaLayer = null;
        return;
      }
      capaSucursales.resetStyle(zonaSeleccionadaLayer);
      zonaSeleccionadaLayer = null;
    }

    function seleccionarZonaADR(layer, nombreZona) {
      if (zonaSeleccionadaLayer && zonaSeleccionadaLayer !== layer) {
        capaSucursales.resetStyle(zonaSeleccionadaLayer);
      }

      if (zonaSeleccionadaLayer === layer) {
        capaSucursales.resetStyle(layer);
        zonaSeleccionadaLayer = null;
      } else {
        zonaSeleccionadaLayer = layer;
        layer.setStyle({
          color: "#d35400",
          weight: 3,
          fillColor: "#f39c12",
          fillOpacity: 0.25
        });
      }

      actualizarBotonLimpiar();
    }

    function actualizarMapa() {
      var crmFiltro = document.getElementById("filtroCRM").value;
      var baseFiltro = document.getElementById("filtroBase").value;
      var delFiltro = document.getElementById("filtroDelegacion").value;
      var misFiltro = document.getElementById("filtroMisionesSubBase").value;
      var rubroFiltro = document.getElementById("filtroRubro").value;

      if (geojsonLayer) map.removeLayer(geojsonLayer);
      if (clusterGroup) map.removeLayer(clusterGroup);

      clusterGroup = L.markerClusterGroup({
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: !modoSeleccionActivo,
        disableClusteringAtZoom: 18,
        iconCreateFunction: function(cluster) {
          var count = cluster.getChildCount();
          var size = 'small';
          if (count > 100) size = 'large';
          else if (count > 30) size = 'medium';
          return L.divIcon({
            html: '<div>' + count + '</div>',
            className: 'marker-cluster marker-cluster-' + size,
            iconSize: L.point(40, 40)
          });
        }
      });
      clusterGroup.on('clusterclick', function(e) {
        if (!modoSeleccionActivo) return;
        L.DomEvent.stop(e.originalEvent);
        e.layer.spiderfy();
      });

      var combinados = (baseFiltro === "todas")
        ? [].concat(datosBases.base1).concat(datosBases.base2).concat(datosBases.base3).concat(datosBases.base4).concat(datosBases.base5).concat(datosBases.base6).concat(datosBases.base7).concat(datosBases.base9).concat(datosBases.base10)
        : (datosBases[baseFiltro] || []);

      geojsonLayer = L.geoJSON(combinados, {
        filter: function(f) {
          var pasaCRM = (crmFiltro === "todos" || f.properties.crm_filtrable === crmFiltro);
          var pasaDelegacion = true;
          if (f._baseID === 'base3' && delFiltro !== "todas") {
            pasaDelegacion = (buscarProp(f.properties, "delegacion") === delFiltro);
          }
          var pasaMisionesSubBase = true;
          if (f._baseID === 'base6' && misFiltro !== "todas") {
            pasaMisionesSubBase = (buscarProp(f.properties, "base") === misFiltro);
          }
          var pasaRubro = true;
           if ((f._baseID === 'base7' || f._baseID === 'base9' || f._baseID === 'base10') && rubroFiltro !== "todos") {
              pasaRubro = normalizarTexto(obtenerValor(f.properties, ["rubro", "Rubro", "RUBRO"])) === normalizarTexto(rubroFiltro);
            }
          return pasaCRM && pasaDelegacion && pasaMisionesSubBase && pasaRubro;
        },
        pointToLayer: function(f, latlng) {
          var col = "#3498db";
           if (f._baseID === 'base5') col = "#27ae60";
           if (f._baseID === 'base4') col = "#9b59b6";
           if (f._baseID === 'base3') col = "#f1c40f";
           if (f._baseID === 'base2') col = "#e67e22";
            if (f._baseID === 'base6') col = "#e74c3c";
            if (f._baseID === 'base7') col = "#16a085";
            if (f._baseID === 'base9') col = "#8e44ad";
            if (f._baseID === 'base10') col = "#2c3e50";
           var isSelected = seleccionManual.has(f.properties._uniqueID);
          return L.circleMarker(latlng, {
            radius: isSelected ? 10 : 8,
            fillColor: col,
            color: isSelected ? "#000" : "#fff",
            weight: isSelected ? 4 : 1.5,
            fillOpacity: 0.9
          });
        },
        onEachFeature: function(f, layer) {
          var p = f.properties;
          var idBase = f._baseID;
          var nombre = limpiar(buscarProp(p, "cliente") || buscarProp(p, "nombre"));
        layer.on('click', function(e) {
            if (modoSeleccionActivo) {
              L.DomEvent.stopPropagation(e);
              var uid = p._uniqueID;
              if (seleccionManual.has(uid)) seleccionManual.delete(uid);
              else seleccionManual.add(uid);
              actualizarMapa();
              actualizarBotonLimpiar();
            }
          });
          var colH = "#2980b9";
           if (idBase === 'base4') colH = "#8e44ad";
           if (idBase === 'base3') colH = "#f39c12";
           if (idBase === 'base2') colH = "#d35400";
            if (idBase === 'base6') colH = "#c0392b";
            if (idBase === 'base7') colH = "#117864";
            if (idBase === 'base9') colH = "#6c3483";
            if (idBase === 'base10') colH = "#1f2d3a";
           var html = '<div style="min-width:200px;"><b style="color:' + colH + ';text-transform:uppercase;">' + nombre + '</b><hr style="margin:5px 0;border:0;border-top:1px solid #eee;">';
          if (idBase === 'base3') {
            html += 'Delegacion: ' + limpiar(buscarProp(p, "delegacion")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "localidad")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono")) + '<br>Mail: ' + limpiar(buscarProp(p, "correo")) + '<br>Suc: ' + limpiar(buscarProp(p, "sucursal")) + '<br>Maq: ' + limpiar(buscarProp(p, "maquinas"));
          } else if (idBase === 'base1') {
            html += 'Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono")) + '<br>Mail: ' + limpiar(buscarProp(p, "correo")) + '<br>Maq: ' + limpiar(buscarProp(p, "maquinas"));
          } else if (idBase === 'base2') {
            html += 'Ubicacion: ' + limpiar(buscarProp(p, "localidad")) + ', ' + limpiar(buscarProp(p, "provincia")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Relevado: ' + limpiar(buscarProp(p, "relevado"));
          } else if (idBase === 'base4') {
            html += 'CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>ID: ' + limpiar(buscarProp(p, "idCliente")) + '<br>Maq: ' + limpiar(buscarProp(p, "maquinas"));
          } else if (idBase === 'base5') {
            html += 'Tipo: ' + limpiar(buscarProp(p, "tipo de espacio")) + '<br>Dir: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "provincia"));
           } else if (idBase === 'base6') {
             html += 'Base: ' + limpiar(buscarProp(p, "base")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Rubro: ' + limpiar(buscarProp(p, "rubro")) + '<br>Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "localidad")) + ', ' + limpiar(buscarProp(p, "provincia")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono")) + '<br>Mail: ' + limpiar(buscarProp(p, "email"));
            } else if (idBase === 'base7') {
              html += 'Base: ' + limpiar(buscarProp(p, "base")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Rubro: ' + limpiar(buscarProp(p, "rubro")) + '<br>Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "localidad")) + ', ' + limpiar(buscarProp(p, "provincia")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono")) + '<br>Mail: ' + limpiar(buscarProp(p, "email"));
             } else if (idBase === 'base9') {
               html += 'Base: ' + limpiar(buscarProp(p, "base")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Rubro: ' + limpiar(buscarProp(p, "rubro")) + '<br>Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "localidad")) + ', ' + limpiar(buscarProp(p, "provincia")) + '<br>AFIP: ' + limpiar(buscarProp(p, "AFIP")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono")) + '<br>Mail: ' + limpiar(buscarProp(p, "email"));
            } else if (idBase === 'base10') {
              html += 'Base: ' + limpiar(buscarProp(p, "base")) + '<br>CUIT: ' + limpiar(buscarProp(p, "cuit")) + '<br>Rubro: ' + limpiar(buscarProp(p, "rubro")) + '<br>Ubicacion: ' + limpiar(buscarProp(p, "direccion")) + ', ' + limpiar(buscarProp(p, "localidad")) + ', ' + limpiar(buscarProp(p, "provincia")) + '<br>AFIP: ' + limpiar(buscarProp(p, "AFIP")) + '<br>CRM: ' + limpiar(buscarProp(p, "CRM")) + '<br>Tel: ' + limpiar(buscarProp(p, "telefono"));
            }
          var webHtml = construirFilaWeb(p);
          if (webHtml) html += webHtml;
          var crmColor = p.crm_filtrable === 'SI' ? '#27ae60' : '#e74c3c';
          html += '<div style="margin-top:8px;font-weight:bold;color:' + crmColor + '">CRM: ' + p.crm_filtrable + '</div></div>';
          layer.bindPopup(html);
          clusterGroup.addLayer(layer);
        }
      });

      map.addLayer(clusterGroup);
      var totalVisible = Object.keys(geojsonLayer._layers).length;
      document.getElementById("contadorPuntos").innerText = 'Visibles: ' + totalVisible + ' | Seleccionados: ' + seleccionManual.size;
      actualizarBotonLimpiar();
    }

    function obtenerValor(p, posiblesClaves) {
      if (!p) return null;
      for (var i = 0; i < posiblesClaves.length; i++) {
        var claveBuscada = posiblesClaves[i].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        var claves = Object.keys(p);
        for (var j = 0; j < claves.length; j++) {
          var claveReal = claves[j].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
          if (claveReal === claveBuscada) return p[claves[j]];
        }
      }
      return null;
    }

    function normalizarUrlWeb(valor) {
      if (!valor) return null;
      var texto = valor.toString().trim();
      if (!texto) return null;
      if (/^https?:\/\//i.test(texto)) return texto;
      if (/^www\./i.test(texto)) return 'https://' + texto;
      if (texto.indexOf('@') !== -1) return null;
      if (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(texto)) return 'https://' + texto;
      return null;
    }

    function construirFilaWeb(p) {
      var valorWeb = obtenerValor(p, ["email_web", "web", "website", "url", "sitio", "pagina", "Correo"]);
      var urlWeb = normalizarUrlWeb(valorWeb);
      if (!urlWeb) return "";
      var textoWeb = limpiar(valorWeb);
      return '<div class="web-link-row"><span class="web-link-icon" aria-hidden="true"></span><a href="' + urlWeb + '" target="_blank" rel="noopener noreferrer">' + textoWeb + '</a></div>';
    }

    function exportarListado() {
      registrarEventoMetrica("exportacion");
      var seleccionados = [];
      if (seleccionManual.size > 0) {
        var todos = [].concat(datosBases.base1).concat(datosBases.base2).concat(datosBases.base3).concat(datosBases.base4).concat(datosBases.base5).concat(datosBases.base6).concat(datosBases.base7).concat(datosBases.base9).concat(datosBases.base10);
        seleccionados = todos.filter(function(f) { return seleccionManual.has(f.properties._uniqueID); });
      } else {
        geojsonLayer.eachLayer(function(l) { seleccionados.push(l.feature); });
      }
      var sinCuit = [];
      var porGrupo = {};
      seleccionados.forEach(function(f, idx) {
        var p = f.properties;
        var base = f._baseID;
        var subbase = obtenerValor(p, ["base"]) || "-";
        var cuitRaw = obtenerValor(p, ["cuit", "CUIT", "Cuit"]);
        var cuit = cuitRaw ? cuitRaw.toString().trim() : "";
        if (cuit === "" || cuit === "0" || cuit === "-") {
          sinCuit.push(f);
        } else {
          var clave = base + "__" + subbase + "__" + cuit;
          if (!porGrupo[clave]) porGrupo[clave] = [];
          porGrupo[clave].push({ feature: f, idx: idx });
        }
      });
      var deduplicados = sinCuit.slice();
      Object.keys(porGrupo).forEach(function(clave) {
        var grupo = porGrupo[clave];
        if (grupo.length === 1) {
          deduplicados.push(grupo[0].feature);
        } else {
          var mejor = grupo[0];
          var mejorScore = contarCampos(mejor.feature.properties);
          for (var i = 1; i < grupo.length; i++) {
            var score = contarCampos(grupo[i].feature.properties);
            if (score > mejorScore) {
              mejor = grupo[i];
              mejorScore = score;
            }
          }
          deduplicados.push(mejor.feature);
        }
      });
      var csv = "Base,Nombre,CRM,Delegacion,SubBase_Misiones,CUIT,ID_Cliente,Direccion,Localidad,Provincia,Telefono,Email,Rubro\n";
      deduplicados.forEach(function(f) {
        csv += nombresDeBases[f._baseID] + ',' + exportarCSV(f.properties) + '\n';
      });
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = 'reporte_comercial.csv';
      link.click();
    }

    function contarCampos(p) {
      var score = 0;
      var campos = [
        ["cliente", "Cliente"], ["nombre", "Nombre", "NOMBRE"],
        ["cuit", "CUIT", "Cuit"], ["direccion", "Direccion", "DIRECCIÓN", "DOMICILIO"],
        ["geocoding"], ["localidad", "Localidad"], ["provincia", "Provincia"],
        ["telefono", "Telefono", "TELÉFONO", "TELEFONO"],
        ["correo", "email", "Email", "EMAIL", "correo electronico"],
        ["delegacion", "Delegacion"], ["base", "Base", "BASE"],
        ["idCliente", "idCliente"], ["rubro", "Rubro", "RUBRO"]
      ];
      campos.forEach(function(c) {
        var v = obtenerValor(p, c);
        if (v) {
          var s = v.toString().trim().toUpperCase();
          if (s !== "" && s !== "0" && s !== "-" && s !== "N/A" && s !== "NULL" && s !== "NA") score++;
        }
      });
      return score;
    }

    function exportarCSV(p) {
      var nombre = obtenerValor(p, ["cliente", "Cliente"]) || obtenerValor(p, ["nombre", "Nombre", "NOMBRE"]) || "-";
      var crm = p.crm_filtrable || "-";
      var delegacion = obtenerValor(p, ["delegacion", "Delegacion"]) || "-";
      var subbase = obtenerValor(p, ["base", "Base", "BASE"]) || "-";
      var cuit = obtenerValor(p, ["cuit", "CUIT", "Cuit"]) || "-";
      var idCliente = obtenerValor(p, ["idCliente"]) || "-";
      var dir = obtenerValor(p, ["direccion", "Direccion", "DIRECCIÓN", "DOMICILIO"]) || obtenerValor(p, ["geocoding"]) || "-";
      var loc = obtenerValor(p, ["localidad", "Localidad"]) || "-";
      var prov = obtenerValor(p, ["provincia", "Provincia"]) || "-";
      var tel = obtenerValor(p, ["telefono", "Telefono", "TELÉFONO", "TELEFONO"]) || "-";
      var mail = obtenerValor(p, ["correo", "email", "Email", "EMAIL"]) || "-";
      var rubro = obtenerValor(p, ["rubro", "Rubro", "RUBRO"]) || "-";
      return nombre.replace(/,/g, "") + ',' + crm + ',' + delegacion + ',' + subbase + ',' + cuit + ',' + idCliente + ',' + dir.replace(/,/g, " ") + ',' + loc + ',' + prov + ',' + tel + ',' + mail + ',' + rubro;
    }
  </script>
