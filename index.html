<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial Interactivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.7em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #fff; color: #333; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3 style="margin-top:0; text-align:center; font-size: 1.1em; letter-spacing: 1px;">CONTROL DE MAPA</h3>
  
  <div class="control-group">
    <label>📂 Seleccionar Base:</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Socios CACF (Forrajeros)</option>
      <option value="base2">Socios CAPIA (Avícolas)</option>
      <option value="base3">Socios CAMARCO Santa Fe</option>
    </select>
  </div>

  <div class="control-group">
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // 1. Setup del Mapa
  var map = L.map('map').setView([-31.63, -60.70], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
    attribution: '© OpenStreetMap' 
  }).addTo(map);

  let datosBases = { base1: [], base2: [], base3: [] };
  let geojsonLayer;
  let capaSucursales;

  // 2. Buscador de propiedades "Anti-Error" (Ignora tildes, mayúsculas y espacios)
  function buscarProp(props, clave) {
    if (!props) return null;
    const claveNorm = clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const realKey = Object.keys(props).find(k => {
      const keyNorm = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
      return keyNorm === claveNorm;
    });
    return realKey ? props[realKey] : null;
  }

  function limpiar(v, reemplazo = "-") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "0") return reemplazo;
    return v.toString().trim();
  }

  // 3. Carga de Capa de Sucursales (Polígonos de fondo)
  function cargarZonasSucursales() {
    fetch('sucursales.geojson')
      .then(r => r.json())
      .then(data => {
        capaSucursales = L.geoJSON(data, {
          style: { color: "#7f8c8d", weight: 1.5, fillColor: "#bdc3c7", fillOpacity: 0.15 },
          onEachFeature: function(f, l) {
            const n = buscarProp(f.properties, "name") || buscarProp(f.properties, "sucursal") || "Zona";
            l.bindPopup(`<b>Sucursal:</b><br>${n}`);
            l.on({
              mouseover: e => e.target.setStyle({ fillOpacity: 0.3 }),
              mouseout: e => capaSucursales.resetStyle(e.target)
            });
          }
        }).addTo(map);
        capaSucursales.bringToBack();
      }).catch(() => console.log("Capa sucursales no cargada"));
  }

  // 4. Carga de los 3 archivos GeoJSON
  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data3.geojson').then(r => r.json()).catch(() => ({features:[]}))
  ]).then(([d1, d2, d3]) => {
    datosBases.base1 = (d1.features || []).map(f => ({ ...f, _baseID: 'base1' }));
    datosBases.base2 = (d2.features || []).map(f => ({ ...f, _baseID: 'base2' }));
    datosBases.base3 = (d3.features || []).map(f => ({ ...f, _baseID: 'base3' }));
    
    cargarZonasSucursales();
    actualizarMapa();
  });

  // 5. Función de renderizado y filtros
  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    const baseFiltro = document.getElementById("filtroBase").value;

    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = [];
    if (baseFiltro === "todas") {
      combinados = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3];
    } else {
      combinados = datosBases[baseFiltro] || [];
    }

    geojsonLayer = L.geoJSON(combinados, {
      filter: function(f) {
        if (crmFiltro === "todos") return true;
        const crmVal = (buscarProp(f.properties, "crm") || "NO").toString().toUpperCase().trim();
        return crmVal === crmFiltro;
      },
      pointToLayer: function(f, latlng) {
        let col = "#3498db"; // Azul CACF
        if (f._baseID === 'base3') col = "#f1c40f"; // Amarillo CAMARCO
        if (f._baseID === 'base2') col = "#e67e22"; // Naranja CAPIA

        return L.circleMarker(latlng, {
          radius: 8, fillColor: col, color: "#fff", weight: 1.5, fillOpacity: 0.9
        });
      },
      onEachFeature: function(f, layer) {
        const p = f.properties;
        
        // Mapeo de campos dinámico según la base
        const nombre = limpiar(buscarProp(p, "nombre") || buscarProp(p, "cliente"), "Empresa");
        const crm = (buscarProp(p, "crm") || "NO").toString().toUpperCase().trim();
        const direccion = limpiar(buscarProp(p, "direccion"), "-");
        const localidad = limpiar(buscarProp(p, "localidad"), "-");
        const cuit = limpiar(buscarProp(p, "cuit"), "-");
        const tel = limpiar(buscarProp(p, "telefono"), "-");
        const mail = limpiar(buscarProp(p, "correo") || buscarProp(p, "email"), "-");
        const maq = limpiar(buscarProp(p, "maquinas"), "-");
        const suc = limpiar(buscarProp(p, "sucursal"), "-");

        let colH = (f._baseID === 'base3') ? "#f39c12" : (f._baseID === 'base2' ? "#d35400" : "#2980b9");

        let html = `<div style="min-width: 220px; font-family: sans-serif; line-height: 1.4;">
          <b style="color: ${colH}; text-transform: uppercase; font-size: 13px;">${nombre}</b>
          <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
          📍 <b>Ubicación:</b><br><small style="color:#555;">${direccion}, ${localidad}</small><br><br>`;

        if (f._baseID === 'base3') {
          // CAMARCO específico
          html += `🆔 <b>CUIT:</b> ${cuit}<br>
                   📞 <b>Tel:</b> ${tel}<br>
                   📧 <b>Email:</b> ${mail}<br>
                   🚜 <b>Máquinas:</b> ${maq}<br>
                   🏢 <b>Sucursal:</b> ${suc}<br>`;
        } else if (f._baseID === 'base2') {
          // CAPIA específico
          html += `🆔 <b>CUIT:</b> ${cuit}<br>
                   ✅ <b>Relevado:</b> ${limpiar(buscarProp(p, "relevado"))}<br>`;
        } else {
          // CACF específico
          html += `🚜 <b>Maquinaria:</b> ${maq}<br>
                   🔢 <b>Cantidad:</b> ${limpiar(buscarProp(p, "cantidad"), "0")}<br>`;
        }

        html += `<div style="background:#f8f9fa; padding:10px; border-radius:8px; margin-top:12px; border-left:5px solid #2c3e4e; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: bold; font-size: 11px; color: #7f8c8d;">ESTADO CRM</span>
          <span style="color: ${crm === 'SI' ? '#27ae60' : '#e74c3c'}; font-weight: 800;">${crm}</span>
        </div></div>`;

        layer.bindPopup(html);
      }
    }).addTo(map);

    if (capaSucursales) capaSucursales.bringToBack();
  }

  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
  document.getElementById("filtroBase").addEventListener("change", actualizarMapa);
</script>

</body>
</html>
