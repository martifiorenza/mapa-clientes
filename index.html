<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial - Mapa Integrado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.7em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; color: #333; font-weight: 600; cursor: pointer; }
    h3 { margin-top:0; text-align:center; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE MAPA</h3>
  
  <div class="control-group">
    <label>📂 Seleccionar Base:</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Socios CACF (Forrajeros)</option>
      <option value="base2">Socios CAPIA (Avícolas)</option>
      <option value="base3">Socios CAMARCO Santa Fe</option>
      <option value="base4">Comunas y Municipios</option>
    </select>
  </div>

  <div class="control-group">
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  var map = L.map('map').setView([-31.63, -60.70], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  let datosBases = { base1: [], base2: [], base3: [], base4: [] };
  let geojsonLayer;

  // Función para buscar propiedades sin importar mayúsculas/minúsculas/tildes
  function buscarProp(props, clave) {
    if (!props) return null;
    const claveNorm = clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const realKey = Object.keys(props).find(k => 
      k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === claveNorm
    );
    return realKey ? props[realKey] : null;
  }

  function limpiar(v, reemplazo = "-") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "0") return reemplazo;
    return v.toString().trim();
  }

  // Carga y Normalización de Datos
  function procesarFeatures(features, idBase) {
    return (features || []).map(f => {
      let p = f.properties || {};
      let rawCRM = buscarProp(p, "crm");
      let idCli = buscarProp(p, "idCliente");
      
      // Lógica de CRM: Por defecto es NO
      let estadoFinal = "NO";
      
      // Si el campo CRM dice "SI" (en cualquier formato), es SI.
      if (rawCRM && rawCRM.toString().toUpperCase().trim() === "SI") {
        estadoFinal = "SI";
      }
      
      // REGLA ESPECIAL: Si es Base 4 y no tiene idCliente, forzamos NO aunque diga SI.
      if (idBase === 'base4' && (!idCli || idCli === "-" || idCli === 0 || idCli === "0")) {
        estadoFinal = "NO";
      }

      p.crm_filtrable = estadoFinal; // Propiedad oculta para el filtro
      return { ...f, properties: p, _baseID: idBase };
    });
  }

  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data3.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data4.geojson').then(r => r.json()).catch(() => ({features:[]}))
  ]).then(([d1, d2, d3, d4]) => {
    datosBases.base1 = procesarFeatures(d1.features, 'base1');
    datosBases.base2 = procesarFeatures(d2.features, 'base2');
    datosBases.base3 = procesarFeatures(d3.features, 'base3');
    datosBases.base4 = procesarFeatures(d4.features, 'base4');
    
    console.log("Datos cargados. Base 4 total:", datosBases.base4.length);
    actualizarMapa();
  });

  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    const baseFiltro = document.getElementById("filtroBase").value;

    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = [];
    if (baseFiltro === "todas") {
      combinados = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3, ...datosBases.base4];
    } else {
      combinados = datosBases[baseFiltro] || [];
    }

    geojsonLayer = L.geoJSON(combinados, {
      filter: function(f) {
        const estado = f.properties.crm_filtrable;
        if (crmFiltro === "todos") return true;
        return estado === crmFiltro;
      },
      pointToLayer: function(f, latlng) {
        let col = "#3498db"; 
        if (f._baseID === 'base4') col = "#9b59b6"; // VIOLETA
        if (f._baseID === 'base3') col = "#f1c40f"; // AMARILLO
        if (f._baseID === 'base2') col = "#e67e22"; // NARANJA
        
        return L.circleMarker(latlng, {
          radius: 8, fillColor: col, color: "#fff", weight: 1.5, fillOpacity: 0.9
        });
      },
      onEachFeature: function(f, layer) {
        const p = f.properties;
        const nombre = limpiar(buscarProp(p, "cliente") || buscarProp(p, "nombre"), "Empresa");
        const crmEstado = p.crm_filtrable;
        const maq = limpiar(buscarProp(p, "maquinas") || buscarProp(p, "máquinas"), "-");
        
        let colH = (f._baseID === 'base4') ? "#8e44ad" : (f._baseID === 'base3' ? "#f39c12" : "#2980b9");

        let html = `<div style="min-width: 220px; font-family: sans-serif; line-height: 1.4;">
          <b style="color: ${colH}; text-transform: uppercase; font-size: 13px;">${nombre}</b>
          <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">`;

        if (f._baseID === 'base4') {
          html += `🆔 <b>ID Cliente:</b> ${limpiar(buscarProp(p, "idCliente"))}<br>
                   📍 <b>Ubicación:</b> <br><small style="color:#555;">${limpiar(buscarProp(p, "geocoding"))}</small><br>
                   🚜 <b>Maquinas:</b> ${maq}<br>`;
        } else {
          html += `📍 <b>Ubicación:</b><br><small style="color:#555;">${limpiar(buscarProp(p, "direccion") || buscarProp(p, "localidad"))}</small><br><br>
                   🆔 <b>CUIT/ID:</b> ${limpiar(buscarProp(p, "cuit") || buscarProp(p, "idCliente"))}<br>
                   🚜 <b>Máquinas:</b> ${maq}<br>`;
        }

        html += `<div style="background:#f8f9fa; padding:10px; border-radius:8px; margin-top:12px; border-left:5px solid #2c3e4e; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: bold; font-size: 11px; color: #7f8c8d;">ESTADO CRM</span>
          <span style="color: ${crmEstado === 'SI' ? '#27ae60' : '#e74c3c'}; font-weight: 800;">${crmEstado}</span>
        </div></div>`;

        layer.bindPopup(html);
      }
    }).addTo(map);
  }

  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
  document.getElementById("filtroBase").addEventListener("change", actualizarMapa);
</script>

</body>
</html>
