<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Agrícola Interactivos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    
    /* Panel de Control a la Derecha */
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #panelCapas h3 { margin: 0 0 15px 0; font-size: 1.1em; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; letter-spacing: 1px; }
    .control-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 0.75em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #fdfdfd; color: #333; font-weight: 600; cursor: pointer; font-size: 0.9em; }
    select:focus { outline: 3px solid #3498db; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE CLIENTES</h3>
  
  <div class="control-group">
    <label>📂 Seleccionar Base:</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Socios CACF (Forrajeros) </option>
      <option value="base2">Socios CAPIA (Avicolas) </option>
    </select>
  </div>

  <div class="control-group">
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // 1. Configuración del mapa
  var map = L.map('map').setView([-34.0, -61.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
    attribution: '© OpenStreetMap' 
  }).addTo(map);

  let datosBase1 = { features: [] };
  let datosBase2 = { features: [] };
  let geojsonLayer;      // Capa dinámica de clientes
  let capaSucursales;    // Capa estática de fondo (zonas)

  // 2. Buscador de propiedades (insensible a Mayúsculas/Minúsculas/Acentos)
  function buscarProp(props, clave) {
    if (!props) return null;
    const realKey = Object.keys(props).find(k => 
      k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") === 
      clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    );
    return realKey ? props[realKey] : null;
  }

  // 3. Limpieza de datos
  function limpiar(v, reemplazo = "No disponible") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "-") return reemplazo;
    return v.toString().trim();
  }

  // 4. Carga de la Capa de Sucursales (Zonas Polígonos)
  function cargarZonasSucursales() {
    fetch('sucursales.geojson')
      .then(r => r.json())
      .then(data => {
        capaSucursales = L.geoJSON(data, {
          style: function(feature) {
            return {
              color: "#7f8c8d",      // Borde gris oscuro
              weight: 1.5,           // Grosor del borde
              fillColor: "#bdc3c7",  // Relleno gris clarito
              fillOpacity: 0.15,     // Muy clarito para que sea sutil
              interactive: false     // No interfiere con los clics en los puntos
            };
          }
        }).addTo(map);
        capaSucursales.bringToBack(); // Siempre detrás
      })
      .catch(e => console.error("Error cargando sucursales.geojson:", e));
  }

  // 5. Carga de bases de clientes
  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]}))
  ]).then(([d1, d2]) => {
    datosBase1 = d1;
    datosBase2 = d2;
    
    cargarZonasSucursales(); // Carga la capa de fondo
    actualizarMapa();        // Dibuja los puntos
  });

  // 6. Lógica de renderizado y filtros
  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    const baseFiltro = document.getElementById("filtroBase").value;

    // Solo borramos la capa de clientes, la de sucursales es persistente
    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = [];
    if (baseFiltro === "todas" || baseFiltro === "base1") combinados = combinados.concat(datosBase1.features);
    if (baseFiltro === "todas" || baseFiltro === "base2") combinados = combinados.concat(datosBase2.features);

    geojsonLayer = L.geoJSON(combinados, {
      filter: function(f) {
        if (crmFiltro === "todos") return true;
        let valorEnData = buscarProp(f.properties, "crm");
        if (!valorEnData) return crmFiltro === "NO";
        return valorEnData.toString().toUpperCase().trim() === crmFiltro;
      },
      pointToLayer: function(feature, latlng) {
        // Determinamos color: CAPIA (si tiene cuit) = Naranja, CACF = Azul
        const esCapia = buscarProp(feature.properties, "cuit") !== null;
        return L.circleMarker(latlng, {
          radius: 7,
          fillColor: esCapia ? "#e67e22" : "#3498db",
          color: "#ffffff",
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        });
      },
      onEachFeature: function(f, layer) {
        const p = f.properties;
        const esCapia = buscarProp(p, "cuit") !== null;

        const nombre = limpiar(buscarProp(p, "cliente"), "Empresa");
        const crm = limpiar(buscarProp(p, "crm"), "NO").toUpperCase();
        
        // Ubicación
        const loc = buscarProp(p, "localidad");
        const prov = buscarProp(p, "provincia");
        const calle = buscarProp(p, "direccion");
        
        let ubicacionHTML = "";
        if (esCapia) {
          ubicacionHTML = [loc, prov].filter(x => x && x !== "-").join(", ");
        } else {
          ubicacionHTML = [calle, loc, prov].filter(x => x && x !== "-").join(", ");
        }

        let html = `<div style="min-width: 220px; font-family: sans-serif; line-height: 1.5;">
          <b style="color: ${esCapia ? '#d35400' : '#2980b9'}; text-transform: uppercase;">${nombre}</b>
          <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
          📍 <b>Ubicación:</b><br>
          <small style="color: #555;">${ubicacionHTML || "No disponible"}</small><br><br>`;

        if (esCapia) {
          html += `🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>
                   ✅ <b>Relevado:</b> ${limpiar(buscarProp(p, "relevado"))}<br>`;
        } else {
          html += `🚜 <b>Máquinas:</b> ${limpiar(buscarProp(p, "maquinas"))}<br>
                   🔢 <b>Cantidad:</b> ${limpiar(buscarProp(p, "cantidad"), "0")}<br>`;
        }

        html += `<div style="background:#f8f9fa; padding:8px; border-radius:6px; margin-top:10px; border-left:4px solid #2c3e4e; display: flex; justify-content: space-between;">
          <span style="font-weight: bold; font-size: 10px; color: #7f8c8d;">ESTADO CRM</span>
          <span style="color: ${crm === 'SI' ? '#27ae60' : '#e74c3c'}; font-weight: 800;">${crm}</span>
        </div></div>`;

        layer.bindPopup(html);
      }
    }).addTo(map);

    // Aseguramos que las zonas queden al fondo tras actualizar clientes
    if (capaSucursales) capaSucursales.bringToBack();
  }

  // 7. Eventos de los filtros
  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
  document.getElementById("filtroBase").addEventListener("change", actualizarMapa);
</script>

</body>
</html>
