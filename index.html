<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Comercial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 0.7em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #fff; color: #333; font-weight: 600; cursor: pointer; }
    h3 { margin-top:0; text-align:center; font-size: 1.1em; letter-spacing: 1px; color: #fff; }
    
    .switch-group { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    .switch-group label { margin: 0; cursor: pointer; color: #fff; font-size: 0.85em; text-transform: none; }
    
    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 8px; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-download { background: #27ae60; }
    .btn-download:hover { background: #2ecc71; }
    .btn-selection { background: #34495e; border: 1px solid #7f8c8d; }
    .btn-selection.active { background: #9b59b6; border-color: #fff; }
    .btn-clear { background: #e74c3c; font-size: 0.8em; }
    
    .info-count { font-size: 0.8em; color: #ecf0f1; text-align: center; margin: 10px 0; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px; }
    #contenedorDelegacion, #contenedorMisionesBase { display: none; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border: 1px dashed #7f8c8d; margin-top: 10px; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE MAPA</h3>

  <div class="switch-group">
    <label for="checkADR">🗺️ Ver Capa ADR (Sucursales)</label>
    <input type="checkbox" id="checkADR" checked onchange="toggleCapaADR()">
  </div>
  
  <div class="control-group">
    <label>📂 Seleccionar Base:</label>
    <select id="filtroBase" onchange="gestionarFiltrosEspeciales()">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Socios CACF (Forrajeros)</option>
      <option value="base2">Socios CAPIA (Avícolas)</option>
      <option value="base3">Socios CAMARCO </option>
      <option value="base4">Comunas y Municipios</option>
      <option value="base5">Cooperativas Agropecuarias</option>
      <option value="base6">Bases Misiones</option>
    </select>
  </div>

  <div id="contenedorDelegacion" class="control-group">
    <label>🏛️ Filtrar por Delegación:</label>
    <select id="filtroDelegacion" onchange="actualizarMapa()">
      <option value="todas">Todas las Delegaciones</option>
    </select>
  </div>

  <div id="contenedorMisionesBase" class="control-group">
    <label>🚩 Filtrar por Sub-Base (Misiones):</label>
    <select id="filtroMisionesSubBase" onchange="actualizarMapa()">
      <option value="todas">Todas las Sub-Bases</option>
    </select>
  </div>

  <div class="control-group">
    <label>📊 Estado CRM:</label>
    <select id="filtroCRM" onchange="actualizarMapa()">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">En CRM (SI)</option>
      <option value="NO">Fuera de CRM (NO)</option>
    </select>
  </div>

  <div id="contadorPuntos" class="info-count">Visibles: 0 | Seleccionados: 0</div>

  <button id="btnModoSeleccion" class="btn-action btn-selection" onclick="toggleModoSeleccion()">
    🖱️ Modo Selección: OFF
  </button>
  <button class="btn-action btn-download" onclick="exportarListado()">📥 Descargar Listado (CSV)</button>
  <button id="btnClear" class="btn-action btn-clear" style="display:none;" onclick="limpiarSeleccionManual()">🧹 Limpiar Selección</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
  var map = L.map('map').setView([-31.63, -60.70], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  let datosBases = { base1: [], base2: [], base3: [], base4: [], base5: [], base6: [] };
  let geojsonLayer;
  let capaSucursales;
  let seleccionManual = new Set();
  let modoSeleccionActivo = false;

  const nombresDeBases = {
    'base1': 'Socios CACF (Forrajeros)', 'base2': 'Socios CAPIA (Avícolas)',
    'base3': 'Socios CAMARCO Santa Fe', 'base4': 'Comunas y Municipios',
    'base5': 'Cooperativas Agropecuarias', 'base6': 'Bases Misiones'
  };

  function buscarProp(props, clave) {
    if (!props) return null;
    const claveNorm = clave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    const realKey = Object.keys(props).find(k => k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() === claveNorm);
    return realKey ? props[realKey] : null;
  }

  function limpiar(v, reemplazo = "-") {
    if (v === undefined || v === null || v.toString().trim() === "" || v === "0") return reemplazo;
    return v.toString().trim();
  }

  function toggleCapaADR() {
    if (!capaSucursales) return;
    if (document.getElementById("checkADR").checked) {
      capaSucursales.addTo(map);
      capaSucursales.bringToBack();
    } else {
      map.removeLayer(capaSucursales);
    }
  }

  function cargarZonasSucursales() {
    fetch('sucursales.geojson').then(r => r.json()).then(data => {
      capaSucursales = L.geoJSON(data, {
        style: { color: "#2c3e50", weight: 2, fillColor: "#34495e", fillOpacity: 0.1 }
      });
      toggleCapaADR();
    }).catch(e => console.log("Sucursales no encontradas"));
  }

  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data3.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data4.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data5.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data6.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data7.geojson').then(r => r.json()).catch(() => ({features:[]})) // Nueva Base
  ]).then(([d1, d2, d3, d4, d5, d6, d7]) => {
    datosBases.base1 = procesarFeatures(d1.features, 'base1');
    datosBases.base2 = procesarFeatures(d2.features, 'base2');
    datosBases.base3 = procesarFeatures(d3.features, 'base3');
    datosBases.base4 = procesarFeatures(d4.features, 'base4');
    datosBases.base5 = procesarFeatures(d5.features, 'base5');
    
    // Unificar data6 y data7 en Bases Misiones (base6)
    let misionesFeatures = (d6.features || []).concat(d7.features || []);
    datosBases.base6 = procesarFeatures(misionesFeatures, 'base6');

    llenarSelectorDelegaciones();
    llenarSelectorMisionesBase();
    cargarZonasSucursales();
    actualizarMapa();
  });

  function procesarFeatures(features, idBase) {
    return (features || []).map((f, index) => {
      let p = f.properties || {};
      p._uniqueID = `${idBase}_${index}`; 
      let rawCRM = buscarProp(p, "crm");
      let estadoFinal = "NO";
      
      if (rawCRM && rawCRM.toString().toUpperCase().trim().includes("SI")) {
          estadoFinal = "SI";
      }

      p.crm_filtrable = estadoFinal;
      return { ...f, properties: p, _baseID: idBase };
    });
  }

  function llenarSelectorDelegaciones() {
    const selector = document.getElementById("filtroDelegacion");
    selector.innerHTML = '<option value="todas">Todas las Delegaciones</option>';
    const delegaciones = [...new Set(datosBases.base3.map(f => buscarProp(f.properties, "delegacion")).filter(d => d))];
    delegaciones.sort().forEach(d => {
      let opt = document.createElement("option");
      opt.value = d; opt.innerText = d;
      selector.appendChild(opt);
    });
  }

  function llenarSelectorMisionesBase() {
    const selector = document.getElementById("filtroMisionesSubBase");
    selector.innerHTML = '<option value="todas">Todas las Sub-Bases</option>';
    const basesMisiones = [...new Set(datosBases.base6.map(f => buscarProp(f.properties, "base")).filter(b => b))];
    basesMisiones.sort().forEach(b => {
      let opt = document.createElement("option");
      opt.value = b; opt.innerText = b;
      selector.appendChild(opt);
    });
  }

  function gestionarFiltrosEspeciales() {
    const base = document.getElementById("filtroBase").value;
    document.getElementById("contenedorDelegacion").style.display = (base === "base3" || base === "todas") ? "block" : "none";
    document.getElementById("contenedorMisionesBase").style.display = (base === "base6" || base === "todas") ? "block" : "none";
    actualizarMapa();
  }

  function toggleModoSeleccion() {
    modoSeleccionActivo = !modoSeleccionActivo;
    document.getElementById("btnModoSeleccion").classList.toggle("active", modoSeleccionActivo);
    document.getElementById("btnModoSeleccion").innerText = modoSeleccionActivo ? "🖱️ Modo Selección: ON" : "🖱️ Modo Selección: OFF";
  }

  function limpiarSeleccionManual() {
    seleccionManual.clear();
    actualizarMapa();
    document.getElementById("btnClear").style.display = "none";
  }

  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value;
    const baseFiltro = document.getElementById("filtroBase").value;
    const delFiltro = document.getElementById("filtroDelegacion").value;
    const misFiltro = document.getElementById("filtroMisionesSubBase").value;

    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = (baseFiltro === "todas") 
      ? [...datosBases.base1, ...datosBases.base2, ...datosBases.base3, ...datosBases.base4, ...datosBases.base5, ...datosBases.base6]
      : (datosBases[baseFiltro] || []);

    geojsonLayer = L.geoJSON(combinados, {
      filter: (f) => {
        const pasaCRM = (crmFiltro === "todos" || f.properties.crm_filtrable === crmFiltro);
        
        let pasaDelegacion = true;
        if (f._baseID === 'base3' && delFiltro !== "todas") {
          pasaDelegacion = (buscarProp(f.properties, "delegacion") === delFiltro);
        }

        let pasaMisionesSubBase = true;
        if (f._baseID === 'base6' && misFiltro !== "todas") {
          pasaMisionesSubBase = (buscarProp(f.properties, "base") === misFiltro);
        }

        return pasaCRM && pasaDelegacion && pasaMisionesSubBase;
      },
      pointToLayer: (f, latlng) => {
        let col = "#3498db"; 
        if (f._baseID === 'base5') col = "#27ae60";
        if (f._baseID === 'base4') col = "#9b59b6";
        if (f._baseID === 'base3') col = "#f1c40f"; 
        if (f._baseID === 'base2') col = "#e67e22"; 
        if (f._baseID === 'base6') col = "#e74c3c"; 
        
        let isSelected = seleccionManual.has(f.properties._uniqueID);
        return L.circleMarker(latlng, { 
          radius: isSelected ? 10 : 8, fillColor: col, color: isSelected ? "#000" : "#fff", 
          weight: isSelected ? 4 : 1.5, fillOpacity: 0.9 
        });
      },
      onEachFeature: (f, layer) => {
        const p = f.properties;
        const idBase = f._baseID;
        const nombre = limpiar(buscarProp(p, "cliente") || buscarProp(p, "nombre"));
        
        layer.on('click', (e) => {
          if (modoSeleccionActivo) {
            L.DomEvent.stopPropagation(e);
            const uid = p._uniqueID;
            if (seleccionManual.has(uid)) seleccionManual.delete(uid);
            else seleccionManual.add(uid);
            actualizarMapa();
            document.getElementById("btnClear").style.display = seleccionManual.size > 0 ? "block" : "none";
          }
        });

        let colH = (idBase === 'base4') ? "#8e44ad" : (idBase === 'base3' ? "#f39c12" : (idBase === 'base2' ? "#d35400" : (idBase === 'base6' ? "#c0392b" : "#2980b9")));
        let html = `<div style="min-width: 200px;"><b style="color:${colH}; text-transform:uppercase;">${nombre}</b><hr style="margin:5px 0; border:0; border-top:1px solid #eee;">`;
        
        if (idBase === 'base3') { // CAMARCO
          html += `🏛️ <b>Delegación:</b> ${limpiar(buscarProp(p, "delegacion"))}<br>🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>📍 <b>Ubicación:</b> ${limpiar(buscarProp(p, "direccion"))}, ${limpiar(buscarProp(p, "localidad"))}<br>📞 <b>Tel:</b> ${limpiar(buscarProp(p, "telefono"))}<br>📧 <b>Mail:</b> ${limpiar(buscarProp(p, "correo"))}<br>🏢 <b>Suc:</b> ${limpiar(buscarProp(p, "sucursal"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base1') { // CACF
          html += `📍 <b>Ubicación:</b> ${limpiar(buscarProp(p, "direccion"))}<br>📞 <b>Tel:</b> ${limpiar(buscarProp(p, "telefono"))}<br>📧 <b>Mail:</b> ${limpiar(buscarProp(p, "correo"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base2') { // CAPIA
          html += `📍 <b>Ubicación:</b> ${limpiar(buscarProp(p, "localidad"))}, ${limpiar(buscarProp(p, "provincia"))}<br>🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>🔍 <b>Relevado:</b> ${limpiar(buscarProp(p, "relevado"))}`;
        } else if (idBase === 'base4') { // COMUNAS
          html += `🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>🆔 <b>ID:</b> ${limpiar(buscarProp(p, "idCliente"))}<br>🚜 <b>Máq:</b> ${limpiar(buscarProp(p, "maquinas"))}`;
        } else if (idBase === 'base5') { // COOPERATIVAS
          html += `🏢 <b>Tipo:</b> ${limpiar(buscarProp(p, "tipo de espacio"))}<br>📍 <b>Dir:</b> ${limpiar(buscarProp(p, "direccion"))}, ${limpiar(buscarProp(p, "provincia"))}`;
        } else if (idBase === 'base6') { // BASES MISIONES (data6 + data7)
          html += `🚩 <b>Base:</b> ${limpiar(buscarProp(p, "base"))}<br>
                   🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>
                   🏭 <b>Rubro:</b> ${limpiar(buscarProp(p, "rubro"))}<br>
                   📍 <b>Ubicación:</b> ${limpiar(buscarProp(p, "direccion"))}, ${limpiar(buscarProp(p, "localidad"))}, ${limpiar(buscarProp(p, "provincia"))}<br>
                   📞 <b>Tel:</b> ${limpiar(buscarProp(p, "telefono"))}<br>
                   📧 <b>Mail:</b> ${limpiar(buscarProp(p, "email"))}`;
        }
        
        html += `<div style="margin-top:8px; font-weight:bold; color:${p.crm_filtrable==='SI'?'#27ae60':'#e74c3c'}">CRM: ${p.crm_filtrable}</div></div>`;
        layer.bindPopup(html);
      }
    }).addTo(map);

    document.getElementById("contadorPuntos").innerText = `Visibles: ${Object.keys(geojsonLayer._layers).length} | Seleccionados: ${seleccionManual.size}`;
  }

  function exportarListado() {
    let seleccionados = [];
    if (seleccionManual.size > 0) {
      const todos = [...datosBases.base1, ...datosBases.base2, ...datosBases.base3, ...datosBases.base4, ...datosBases.base5, ...datosBases.base6];
      seleccionados = todos.filter(f => seleccionManual.has(f.properties._uniqueID));
    } else {
      geojsonLayer.eachLayer(l => seleccionados.push(l.feature));
    }

    let csv = "\uFEFFBase,Nombre,CRM,Delegacion,SubBase_Misiones,CUIT,ID_Cliente,Direccion,Localidad,Provincia,Telefono,Email,Rubro\n";
    seleccionados.forEach(f => {
      const p = f.properties;
      csv += `${nombresDeBases[f._baseID]},${limpiar(p.nombre || p.cliente).replace(/,/g,"")},${p.crm_filtrable},${limpiar(buscarProp(p, "delegacion"))},${limpiar(buscarProp(p, "base"))},${limpiar(buscarProp(p, "cuit"))},${limpiar(buscarProp(p, "idCliente"))},${limpiar(buscarProp(p, "direccion") || buscarProp(p, "geocoding")).replace(/,/g," ")},${limpiar(buscarProp(p, "localidad"))},${limpiar(buscarProp(p, "provincia"))},${limpiar(buscarProp(p, "telefono"))},${limpiar(buscarProp(p, "correo") || buscarProp(p, "email"))},${limpiar(buscarProp(p, "rubro"))}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `reporte_comercial.csv`;
    link.click();
  }
</script>
</body>
</html>
