<!DOCTYPE html>
<html>
<head>
  <title>Mapa de Clientes</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

<h2 style="text-align:center;">Mapa de Clientes</h2>
<div id="map" style="height: 600px;"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([-31.65, -60.71], 6);

// Mapa base (gratis)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Traer datos
fetch('data.geojson')
  .then(res => res.json())
  .then(data => {
    L.geoJSON(data, {
      onEachFeature: function (feature, layer) {
      layer.bindPopup(`
      <b>${feature.properties.empresa}</b><br>
      📍 Dirección: ${feature.properties.direccion}<br>
      📞 Teléfono: ${feature.properties.telefono}<br>
      ✉️ Email: ${feature.properties.email}<br>
      🚜 Máquinas: ${feature.properties.maquinas}<br>
      🔢 Cantidad: ${feature.properties.cantidad}<br>
      📊 CRM: ${feature.properties.crm}
`);
      }
    }).addTo(map);
  });
</script>


  <select id="filtroCRM">
  <option value="todos">Todos</option>
  <option value="SI">CRM SI</option>
  <option value="NO">CRM NO</option>
</select>

</body>
</html>
