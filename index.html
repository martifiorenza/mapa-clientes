<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de Clientes - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; }
    #map { height: 100vh; width: 100%; }
    #panelCapas {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #2c3e50; color: white; padding: 20px;
      border-radius: 12px; width: 260px; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    #panelCapas h3 { margin: 0 0 15px 0; font-size: 1.1em; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; color: #ecf0f1; }
    .control-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.75em; font-weight: bold; color: #bdc3c7; text-transform: uppercase; }
    select { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #fdfdfd; color: #333; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div id="panelCapas">
  <h3>CONTROL DE CLIENTES</h3>
  <div class="control-group">
    <label>📂 ORIGEN DE DATOS:</label>
    <select id="filtroBase">
      <option value="todas">Todas las Bases</option>
      <option value="base1">Picadores </option>
      <option value="base2">CAPIA</option>
    </select>
  </div>
  <div class="control-group">
    <label>📊 ESTADO CRM:</label>
    <select id="filtroCRM">
      <option value="todos">Todos los Clientes</option>
      <option value="SI">Registrados (SI)</option>
      <option value="NO">No Registrados (NO)</option>
    </select>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  // Inicializar mapa
  var map = L.map('map').setView([-34.5, -60.0], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

  let datosBase1 = { features: [] };
  let datosBase2 = { features: [] };
  let geojsonLayer;

  // FUNCIÓN MAESTRA: Busca una propiedad sin importar si es Mayus/Minus
  function buscarProp(props, clave) {
    if (!props) return null;
    const realKey = Object.keys(props).find(k => k.toLowerCase() === clave.toLowerCase());
    return realKey ? props[realKey] : null;
  }

  // Limpiar textos y guiones
  function limpiar(v, reemplazo = "N/A") {
    if (!v || v === "undefined" || v === "-" || v === "") return reemplazo;
    return v.toString().trim();
  }

  // Cargar datos
  Promise.all([
    fetch('data.geojson').then(r => r.json()).catch(() => ({features:[]})),
    fetch('data2.geojson').then(r => r.json()).catch(() => ({features:[]}))
  ]).then(([d1, d2]) => {
    datosBase1 = d1;
    datosBase2 = d2;
    actualizarMapa();
  });

  function actualizarMapa() {
    const crmFiltro = document.getElementById("filtroCRM").value; // "SI", "NO" o "todos"
    const baseFiltro = document.getElementById("filtroBase").value;

    if (geojsonLayer) map.removeLayer(geojsonLayer);

    let combinados = [];
    if (baseFiltro === "todas" || baseFiltro === "base1") combinados = combinados.concat(datosBase1.features);
    if (baseFiltro === "todas" || baseFiltro === "base2") combinados = combinados.concat(datosBase2.features);

    geojsonLayer = L.geoJSON(combinados, {
      filter: function(f) {
        if (crmFiltro === "todos") return true;
        
        // Obtenemos el valor de CRM/crm y lo pasamos a MAYÚSCULAS para comparar seguro
        let valorEnData = buscarProp(f.properties, "crm");
        if (!valorEnData) return crmFiltro === "NO"; // Si no existe, lo tratamos como NO
        
        return valorEnData.toString().toUpperCase().trim() === crmFiltro;
      },
      onEachFeature: function(f, layer) {
        const p = f.properties;
        const nombre = limpiar(buscarProp(p, "cliente"), "Empresa");
        const loc = limpiar(buscarProp(p, "localidad"), "");
        const prov = limpiar(buscarProp(p, "provincia"), "");
        const crm = limpiar(buscarProp(p, "crm"), "NO").toUpperCase();
        
        // Detectamos si es CAPIA buscando CUIT o RELEVADO
        const esCapia = buscarProp(p, "cuit") !== null || buscarProp(p, "relevado") !== null;

        let html = `<div style="min-width: 220px;">
          <b style="color: #d35400; text-transform: uppercase;">${nombre}</b>
          <hr style="border:0; border-top:1px solid #eee; margin:8px 0;">
          📍 <b>Ubicación:</b> ${loc}${loc && prov ? ', ' : ''}${prov}<br>`;

        if (esCapia) {
          html += `🆔 <b>CUIT:</b> ${limpiar(buscarProp(p, "cuit"))}<br>
                   ✅ <b>Relevado:</b> ${limpiar(buscarProp(p, "relevado"))}<br>`;
        } else {
          html += `🚜 <b>Máquinas:</b> ${limpiar(buscarProp(p, "maquinas"))}<br>
                   🔢 <b>Cantidad:</b> ${limpiar(buscarProp(p, "cantidad"), "0")}<br>`;
        }

        html += `<div style="background:#f8f9fa; padding:10px; border-radius:6px; margin-top:10px; border-left:4px solid #2c3e50;">
          <b>📊 CRM:</b> <span style="color: ${crm === 'SI' ? 'green' : 'red'}; font-weight: bold;">${crm}</span>
        </div></div>`;

        layer.bindPopup(html);
      }
    }).addTo(map);
  }

  document.getElementById("filtroCRM").addEventListener("change", actualizarMapa);
  document.getElementById("filtroBase").addEventListener("change", actualizarMapa);
</script>
</body>
</html>
